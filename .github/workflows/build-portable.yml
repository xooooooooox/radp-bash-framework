name: Build Portable Binary

on:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows:
      - Create version tag
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., v0.6.32)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'workflow/')))
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 - standard
          - os: ubuntu-latest
            platform: linux-amd64
            variant: standard
            suffix: ""
          # Linux x86_64 - full
          - os: ubuntu-latest
            platform: linux-amd64
            variant: full
            suffix: ""
          # Linux ARM64 - standard (using ARM64 runner)
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            variant: standard
            suffix: ""
          # Linux ARM64 - full (using ARM64 runner)
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            variant: full
            suffix: ""
          # macOS Intel
          - os: macos-15
            platform: darwin-amd64
            variant: standard
            suffix: ""
          - os: macos-15
            platform: darwin-amd64
            variant: full
            suffix: ""
          # macOS Apple Silicon
          - os: macos-14
            platform: darwin-arm64
            variant: standard
            suffix: ""
          - os: macos-14
            platform: darwin-arm64
            variant: full
            suffix: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            version="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            # Read from constants.sh
            version=$(grep -E '^declare -gr gr_fw_version=' \
              src/main/shell/framework/bootstrap/context/vars/constants/constants.sh | \
              sed 's/.*=//' | tr -d '"' | tr -d "'")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version: $version"

      - name: Build standard portable
        if: matrix.variant == 'standard'
        shell: bash
        run: |
          chmod +x packaging/binary/build-portable.sh
          ./packaging/binary/build-portable.sh \
            --platform "${{ matrix.platform }}" \
            ${{ matrix.suffix != '' && format('--suffix {0}', matrix.suffix) || '' }}

      - name: Build full portable
        if: matrix.variant == 'full'
        shell: bash
        run: |
          chmod +x packaging/binary/build-portable.sh packaging/binary/bundle-deps.sh
          ./packaging/binary/build-portable.sh \
            --platform "${{ matrix.platform }}" \
            --with-deps \
            ${{ matrix.suffix != '' && format('--suffix {0}', matrix.suffix) || '' }}

      - name: List artifacts
        shell: bash
        run: |
          echo "Built artifacts:"
          ls -la dist/

      - name: Install bash 4.3+ (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          # macOS runners have bash 3.2 by default, install bash 5.x via Homebrew
          brew install bash
          echo "Installed bash version:"
          /opt/homebrew/bin/bash --version || /usr/local/bin/bash --version

      - name: Test portable binary
        if: matrix.variant == 'standard'
        shell: bash
        run: |
          binary_name="radp-bf-portable-${{ matrix.platform }}"
          echo "Testing $binary_name..."
          chmod +x "dist/$binary_name"
          "dist/$binary_name" --help
          "dist/$binary_name" version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.variant }}-${{ matrix.platform }}${{ matrix.suffix && format('-{0}', matrix.suffix) || '' }}
          path: dist/radp-bf-portable*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        startsWith(github.event.workflow_run.head_branch, 'workflow/')))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            head_sha="${{ github.event.workflow_run.head_sha }}"
            tag_name="$(git tag --points-at "${head_sha}" --list 'v*' | sort -V | tail -n 1)"

            # Fallback: read version from constants.sh at that commit
            if [[ -z "${tag_name}" ]]; then
              constants_file="src/main/shell/framework/bootstrap/context/vars/constants/constants.sh"
              version_from_commit="$(git show "${head_sha}:${constants_file}" | sed -n "s/^declare -gr gr_fw_version=//p" | tr -d \"\')"
              if [[ -n "${version_from_commit}" ]]; then
                tag_name="${version_from_commit}"
              fi
            fi
          else
            tag_name="${GITHUB_REF_NAME}"
          fi

          if [[ -z "${tag_name}" ]]; then
            echo "Failed to resolve tag name" >&2
            exit 1
          fi

          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${tag_name}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'radp-bf-portable*' -exec cp {} release-assets/ \;
          echo "Release assets:"
          ls -la release-assets/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag_name }}"

          # Create release if it doesn't exist
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$tag" \
              --generate-notes
          fi

          # Upload all assets
          mapfile -t assets < <(find release-assets -type f | sort)
          if [[ ${#assets[@]} -gt 0 ]]; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            echo "Uploaded ${#assets[@]} portable binaries to release $tag"
          fi

  # Test job for portable binaries
  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Full version test - minimal image, zero dependencies needed
          - name: alpine-full
            image: alpine:latest
            artifact: portable-full-linux-amd64
            install_deps: ""
          # Standard version tests - need bash 4.3+, gnu-getopt, yq
          - name: ubuntu-standard
            image: ubuntu:22.04
            artifact: portable-standard-linux-amd64
            install_deps: "apt-get update && apt-get install -y bash curl && curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 -o /usr/bin/yq && chmod +x /usr/bin/yq"

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Test in container
        run: |
          # Find the binary
          binary=$(find dist -type f -name 'radp-bf-portable*' | head -1)
          chmod +x "$binary"

          echo "Testing in ${{ matrix.image }}..."
          docker run --rm \
            -v "$(pwd)/dist:/dist" \
            ${{ matrix.image }} \
            sh -c '
              # Install dependencies if needed
              ${{ matrix.install_deps }}

              binary=$(find /dist -type f -name "radp-bf-portable*" | head -1)
              chmod +x "$binary"
              echo "=== Testing version ==="
              "$binary" version
              echo "=== Testing help ==="
              "$binary" --help
            '
