# example-cli configuration
# This file follows radp-bash-framework's configuration structure
# Priority: Environment variables (GX_*) > YAML values > defaults

radp:
  env: local

  # Framework settings override (optional)
  fw:
    banner-mode: off
    log:
      debug: false
      level: info
      console:
        enabled: true
      file:
        enabled: false

  # Application-specific extensions
  # Variables defined here will be available as gr_radp_extend_* in shell
  extend:
    example_cli:
      # Version - single source of truth for release management
      # Available as $gr_radp_extend_example_cli_version in shell
      version: v0.0.1
